name: reporte_movil
description: Reporte Móvil de Incidencias - Proyecto Integrador (Flutter + Dart).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: 1.1.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  image_picker_android: '>=0.8.12 <0.8.13'

flutter:
  uses-material-design: true
